name: chiron loader only

on:
  push:
    branches: ['codex/hackios-chiron']
    paths:
      - '.github/workflows/chiron-loader-only.yml'
      - 'ci/hackios/phone_loader.py'
      - 'ci/hackios/apply_chiron.py'
      - 'ci/hackios/apply_chiron_usb.py'
      - 'ci/hackios/apply_chiron_memory.py'
      - 'ci/hackios/apply_chiron_rootufs.py'
      - 'ci/hackios/chiron_root_ufs.inc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the loader toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          clang --version
      - name: Build loader.efi from source with the darwin overlay
        continue-on-error: true
        run: |
          set -x
          mkdir -p dist/phone
          printf '{}\n' > dist/phone/inputs.json
          python3 ci/hackios/phone_loader.py --work "$RUNNER_TEMP/chiron-loader" --phone dist/phone 2>&1 | tee dist/build.log
          echo "exit=$?" >> dist/build.log
      - name: Collect the loader and its build log
        run: |
          ls -l dist/phone dist/build.log 2>&1 | tee -a dist/build.log
          cp "$RUNNER_TEMP/chiron-loader/xnuloader/loader.c" dist/loader.c 2>/dev/null || true
          cp "$RUNNER_TEMP/chiron-loader/xnuloader/build.sh" dist/build.sh 2>/dev/null || true
          test -s dist/phone/loader.efi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: chiron-loader-darwin
          path: dist/
          if-no-files-found: warn
          retention-days: 14
